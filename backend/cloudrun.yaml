apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: mineserver-control
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/sessionAffinity: "true"
    spec:
      timeoutSeconds: 3600
      containers:
      - image: REGION-docker.pkg.dev/PROJECT_ID/mineserver/control:latest
        ports:
        - containerPort: 8080
        env:
        - name: APP_NAME
          value: Mineserver
        - name: GOOGLE_CLIENT_ID
          value: REPLACE_WITH_GOOGLE_WEB_CLIENT_ID
        - name: GOOGLE_CLOUD_PROJECT
          value: PROJECT_ID
        - name: COMPUTE_ZONE
          value: asia-south1-a
        - name: COMPUTE_NETWORK
          value: default
        - name: CONTROL_URL
          value: https://REPLACE_AFTER_DEPLOY
        - name: CORS_ORIGINS
          value: https://REPLACE_AFTER_DEPLOY
        - name: ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              name: mineserver-admin-token
              key: latest
        - name: CURSEFORGE_API_KEY
          valueFrom:
            secretKeyRef:
              name: mineserver-curseforge-api-key
              key: latest
