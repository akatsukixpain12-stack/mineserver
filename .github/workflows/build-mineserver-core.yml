name: Build Mineserver native core

on:
  workflow_dispatch:
  push:
    paths:
      - "server/**"
      - "scripts/build-mineserver.sh"
      - ".github/workflows/build-mineserver-core.yml"

permissions:
  contents: write

jobs:
  linux-x64:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build headless Mineserver binary
        working-directory: server
        run: cargo build --release -p mineserver
      - name: Publish nightly binary
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p dist
          cp server/target/release/mineserver dist/mineserver-linux-x64
          if gh release view mineserver-nightly >/dev/null 2>&1; then
            gh release upload mineserver-nightly dist/mineserver-linux-x64 --clobber
          else
            gh release create mineserver-nightly dist/mineserver-linux-x64 --title "Mineserver nightly" --notes "Automated headless Mineserver native-core build from main."
          fi
