name: Build Mineserver native core

on:
  workflow_dispatch:
  push:
    paths:
      - "server/**"
      - "scripts/build-mineserver.sh"
      - ".github/workflows/build-mineserver-core.yml"

permissions:
  contents: write

jobs:
  linux-x64:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Restore required headless gametest crate from pinned source
        run: |
          set -euxo pipefail
          if [ ! -f server/crates/pumpkin-gametest/Cargo.toml ]; then
            rm -rf /tmp/pumpkin-source
            git init /tmp/pumpkin-source
            git -C /tmp/pumpkin-source remote add origin https://github.com/Pumpkin-MC/Pumpkin.git
            git -C /tmp/pumpkin-source fetch --depth 1 origin a8db585158ba109b4664eb755d7be76f20ac8f6b
            git -C /tmp/pumpkin-source checkout --detach a8db585158ba109b4664eb755d7be76f20ac8f6b
            cp -R /tmp/pumpkin-source/crates/pumpkin-gametest server/crates/pumpkin-gametest
            git add server/crates/pumpkin-gametest
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Add required headless gametest core"
            git push origin HEAD:main
          fi
      - name: Build headless Mineserver binary
        working-directory: server
        run: cargo build --release -p mineserver
      - name: Publish nightly binary
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p dist
          cp server/target/release/mineserver dist/mineserver-linux-x64
          if gh release view mineserver-nightly >/dev/null 2>&1; then
            gh release upload mineserver-nightly dist/mineserver-linux-x64 --clobber
          else
            gh release create mineserver-nightly dist/mineserver-linux-x64 --title "Mineserver nightly" --notes "Automated headless Mineserver native-core build from main."
          fi
