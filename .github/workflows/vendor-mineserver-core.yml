name: Vendor Mineserver native core

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PUMPKIN_COMMIT: a8db585158ba109b4664eb755d7be76f20ac8f6b
    steps:
      - name: Checkout Mineserver web control plane
        uses: actions/checkout@v4
      - name: Clone upstream server source
        run: |
          set -euxo pipefail
          rm -rf /tmp/pumpkin server
          git init /tmp/pumpkin
          git -C /tmp/pumpkin remote add origin https://github.com/Pumpkin-MC/Pumpkin.git
          git -C /tmp/pumpkin fetch --depth 1 origin "$PUMPKIN_COMMIT"
          git -C /tmp/pumpkin checkout --detach "$PUMPKIN_COMMIT"
          mkdir -p server
          rsync -a --delete --exclude '.git/' /tmp/pumpkin/ server/
      - name: Keep the headless server core only
        run: |
          set -euxo pipefail
          rm -rf server/.github server/.devcontainer server/tools/pumpkin-fuzzer server/crates/pumpkin-gametest
          rm -f server/README.md server/AGENTS.md server/CODE_OF_CONDUCT.md server/CONTRIBUTING.md server/SECURITY.md server/Dockerfile server/docker-compose.yml server/default.nix server/flake.lock server/flake.nix server/shell.nix server/.envrc server/egg-pumpkin.json server/typos.toml server/.gitmodules server/assets/icon.ico
      - name: Rebrand native launcher
        run: |
          set -euxo pipefail
          mv server/crates/pumpkin server/crates/mineserver
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('server/Cargo.toml'); s=p.read_text(); s=s.replace('    "crates/pumpkin",','    "crates/mineserver",'); s=s.replace('    "crates/pumpkin-gametest",\n',''); s=s.replace('    "tools/pumpkin-fuzzer",\n',''); p.write_text(s)
          p=Path('server/crates/mineserver/Cargo.toml'); s=p.read_text(); s=s.replace('name = "pumpkin"','name = "mineserver"'); s=s.replace('description = "Empowering everyone to host fast and efficient Minecraft servers."','description = "Mineserver headless Rust Minecraft server core."'); s=re.sub(r'\n\[package\.metadata\.tauri-winres\][\s\S]*?LegalCopyright = ".*?"\n','\n',s); p.write_text(s)
          p=Path('server/crates/mineserver/src/main.rs'); s=p.read_text(); s=s.replace('TextComponent::text("Pumpkin")','TextComponent::text("Mineserver")'); s=s.replace('Pumpkin is running an unoptimized debug build.','Mineserver is running an unoptimized debug build.'); s=s.replace('Pumpkin is currently under heavy development!','Mineserver is currently under heavy development!'); s=s.replace('https://github.com/Pumpkin-MC/Pumpkin/issues','https://github.com/akatsukixpain12-stack/mineserver/issues'); p.write_text(s)
          PY
      - name: Verify web-hosting core shape
        run: |
          set -euo pipefail
          test -f server/LICENSE
          test -f server/Cargo.toml
          test -f server/crates/mineserver/Cargo.toml
          test -f server/crates/mineserver/src/main.rs
          test ! -d server/.github
          test ! -d server/.devcontainer
          test ! -d server/tools/pumpkin-fuzzer
          test ! -d server/crates/pumpkin-gametest
          test ! -f server/README.md
          test ! -f server/Dockerfile
          test ! -f server/docker-compose.yml
          files=$(find server -type f | wc -l)
          bytes=$(du -sb server | cut -f1)
          test "$files" -gt 10000
          test "$bytes" -gt 100000000
          echo "Mineserver native-core files: $files"
          echo "Mineserver native-core bytes: $bytes"
      - name: Commit core
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server scripts
          git diff --cached --quiet && exit 0
          git commit -m "Vendor optimized headless Mineserver core"
          git push origin HEAD:main
