name: Mineserver CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Import application
        env:
          GOOGLE_CLOUD_PROJECT: ""
          GOOGLE_CLIENT_ID: ""
        run: python -c "import sys;sys.path.insert(0,'backend');import app.main;print('Mineserver backend import OK')"
      - name: Smoke test same-origin FastAPI endpoints
        env:
          GOOGLE_CLOUD_PROJECT: ""
          GOOGLE_CLIENT_ID: ""
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,"backend")
          from fastapi.testclient import TestClient
          from app.main import app
          client=TestClient(app)
          assert client.get("/healthz").status_code == 200
          cfg=client.get("/api/config")
          assert cfg.status_code == 200
          assert cfg.json()["same_origin"] is True
          routes={getattr(r,"path","") for r in app.routes}
          required={"/api/config","/api/auth/check","/api/servers","/api/catalog/runtimes","/api/catalog/versions","/agent/ws"}
          assert required <= routes
          print("Mineserver same-origin API smoke test OK")
          PY
      - name: Check frontend JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path("index.html").read_text()
          scripts=re.findall(r"<script(?:\\s[^>]*)?>(.*?)</script>",html,re.S)
          Path("/tmp/mineserver-ui.js").write_text("\\n".join(scripts))
          PY
          node --check /tmp/mineserver-ui.js
